[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.2",
    "livekit-plugins-google>=1.5.2",
    "mss>=10.2.0",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "python-dotenv",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
friday = "server:main"
friday_voice = "agent_karen:dev" # Points to the wrapper

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
